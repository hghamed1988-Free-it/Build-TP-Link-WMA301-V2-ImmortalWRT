name: Build TP-Link WMA301 V2 ImmortalWrt - Exact Device

on:
  workflow_dispatch:

concurrency:
  group: wma301-exact-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_REPO: https://github.com/zeromake/immortalwrt-mt798x-6.6.git
  SOURCE_REF: openwrt-24.10-6.6
  DEVICE_PROFILE: tplink_wma301
  DEVICE_VENDOR: TP-Link
  DEVICE_MODEL: WMA301
  DEVICE_DTS: mt7981b-tplink-wma301
  TARGET_DIR: bin/targets/mediatek/filogic
  TZ: Asia/Shanghai

jobs:
  build:
    name: Build exact TP-Link WMA301 V2 target
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: read

    steps:
      - name: Checkout workflow project
        uses: actions/checkout@v4

      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext \
            gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 \
            libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool llvm lrzsz \
            msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply \
            python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion \
            swig texinfo uglifyjs unzip upx-ucl vim wget xmlto xxd zlib1g-dev zstd

      - name: Clone controlled ImmortalWrt source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --single-branch --branch "$SOURCE_REF" "$SOURCE_REPO" immortalwrt
          cd immortalwrt
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git log --oneline -1

      - name: Verify WMA301 definition in upstream source
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_MK="immortalwrt/target/linux/mediatek/image/filogic.mk"
          TARGET_MK="immortalwrt/target/linux/mediatek/Makefile"
          test -f "$IMAGE_MK"
          test -f "$TARGET_MK"
          subtargets="$(sed -n 's/^SUBTARGETS:=//p' "$TARGET_MK" | head -n1)"
          case " $subtargets " in
            *" filogic "*) ;;
            *)
              echo "ERROR: mediatek/filogic subtarget not found. SUBTARGETS='$subtargets'" >&2
              exit 20
              ;;
          esac
          grep -Fqx "define Device/$DEVICE_PROFILE" "$IMAGE_MK" || {
            echo "ERROR: $DEVICE_PROFILE is not defined in filogic.mk" >&2
            exit 21
          }
          grep -Fqx "TARGET_DEVICES += $DEVICE_PROFILE" "$IMAGE_MK" || {
            echo "ERROR: $DEVICE_PROFILE is not registered in TARGET_DEVICES" >&2
            exit 22
          }
          block="$(sed -n "/^define Device\/$DEVICE_PROFILE$/,/^endef$/p" "$IMAGE_MK")"
          printf '%s\n' "$block"
          grep -Fq 'DEVICE_VENDOR := TP-Link' <<<"$block"
          grep -Fq 'DEVICE_MODEL := WMA301' <<<"$block"
          grep -Fq 'DEVICE_DTS := mt7981b-tplink-wma301' <<<"$block"
          grep -Fq 'IMAGES += factory.bin' <<<"$block"
          grep -Fq 'IMAGE/sysupgrade.bin :=' <<<"$block"
          echo 'Upstream identity gate passed: TP-Link WMA301 / mt7981b-tplink-wma301.'

      - name: Load exact WMA301 configuration
        shell: bash
        run: |
          set -euo pipefail
          cp .config immortalwrt/.config
          cd immortalwrt
          echo '--- requested target before defconfig ---'
          grep -E '^CONFIG_TARGET_(mediatek|DEVICE_|MULTI_PROFILE|PER_DEVICE_ROOTFS|ROOTFS_INITRAMFS)' .config || true

      - name: Update and install feeds
        shell: bash
        working-directory: immortalwrt
        run: |
          set -euo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Resolve configuration
        shell: bash
        working-directory: immortalwrt
        run: |
          set -euo pipefail
          make defconfig

      - name: Hard gate - exact device must be WMA301 only
        shell: bash
        run: |
          set -euo pipefail
          CONFIG='immortalwrt/.config'
          expected="CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_${DEVICE_PROFILE}=y"

          grep -Fxq 'CONFIG_TARGET_mediatek=y' "$CONFIG" || {
            echo 'ERROR: MediaTek target is not selected.' >&2; exit 30;
          }
          grep -Fxq "$expected" "$CONFIG" || {
            echo "ERROR: expected exact device is not selected: $expected" >&2
            echo 'Resolved device lines:' >&2
            grep -E '^CONFIG_TARGET_DEVICE_.+=y$' "$CONFIG" >&2 || true
            exit 31
          }

          mapfile -t selected < <(grep -E '^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_.+=y$' "$CONFIG" || true)
          if [[ ${#selected[@]} -ne 1 ]]; then
            echo "ERROR: expected exactly ONE filogic device; found ${#selected[@]}." >&2
            printf '  %s\n' "${selected[@]:-<none>}" >&2
            exit 32
          fi
          [[ "${selected[0]}" == "$expected" ]] || {
            echo "ERROR: wrong device selected: ${selected[0]}" >&2; exit 33;
          }

          if grep -Eq '^CONFIG_TARGET_DEVICE_mediatek_mt7981_DEVICE_.+=y$' "$CONFIG"; then
            echo 'ERROR: obsolete mediatek_mt7981 per-device namespace survived make defconfig.' >&2
            exit 34
          fi
          if grep -Eiq '^CONFIG_TARGET_DEVICE_.*abt_asr3000=y$' "$CONFIG"; then
            echo 'ERROR: ABT ASR3000 is selected. Build stopped.' >&2
            exit 35
          fi

          echo '=== EXACT RESOLVED DEVICE ==='
          echo "Vendor : $DEVICE_VENDOR"
          echo "Model  : $DEVICE_MODEL"
          echo "Profile: $DEVICE_PROFILE"
          echo "DTS    : $DEVICE_DTS"
          echo 'Target : mediatek/filogic'
          printf 'Config : %s\n' "${selected[0]}"
          echo '================================'
          cp "$CONFIG" effective.config

      - name: Download sources
        shell: bash
        working-directory: immortalwrt
        run: |
          set -euo pipefail
          make download -j"$(nproc)"
          find dl -type f -size -1024c -print -delete || true

      - name: Compile exact WMA301 firmware
        shell: bash
        working-directory: immortalwrt
        run: |
          set -euo pipefail
          echo 'Building exactly: TP-Link WMA301 V2 / tplink_wma301 / mediatek/filogic'
          if ! make -j"$(nproc)"; then
            echo 'Parallel build failed; retrying serially with verbose output.' >&2
            make -j1 V=s
          fi

      - name: Verify build output belongs to WMA301
        shell: bash
        run: |
          set -euo pipefail
          DIR="immortalwrt/$TARGET_DIR"
          test -d "$DIR" || {
            echo "ERROR: expected target output directory is missing: $DIR" >&2
            find immortalwrt/bin/targets -maxdepth 3 -type d -print 2>/dev/null || true
            exit 40
          }

          echo '--- target directory ---'
          ls -lah "$DIR"

          mapfile -t images < <(find "$DIR" -maxdepth 1 -type f \
            \( -name "*${DEVICE_PROFILE}*.bin" -o -name "*${DEVICE_PROFILE}*.itb" -o -name "*${DEVICE_PROFILE}*.ubi" \) \
            -printf '%f\n' | sort)
          if [[ ${#images[@]} -lt 2 ]]; then
            echo "ERROR: expected WMA301 firmware images were not produced." >&2
            printf 'Matched images: %s\n' "${images[*]:-<none>}" >&2
            exit 41
          fi

          if find "$DIR" -maxdepth 1 -type f -iname '*asr3000*' | grep -q .; then
            echo 'ERROR: ASR3000 image exists in the target output. Refusing artifact publication.' >&2
            find "$DIR" -maxdepth 1 -type f -iname '*asr3000*' -print >&2
            exit 42
          fi

          printf 'Verified WMA301 images:\n'
          printf '  %s\n' "${images[@]}"

      - name: Collect only exact WMA301 files
        shell: bash
        run: |
          set -euo pipefail
          DIR="immortalwrt/$TARGET_DIR"
          rm -rf firmware
          mkdir -p firmware

          find "$DIR" -maxdepth 1 -type f \
            \( -name "*${DEVICE_PROFILE}*.bin" -o -name "*${DEVICE_PROFILE}*.itb" -o -name "*${DEVICE_PROFILE}*.ubi" \) \
            -exec cp -v {} firmware/ \;

          for f in config.buildinfo feeds.buildinfo version.buildinfo sha256sums; do
            [[ -f "$DIR/$f" ]] && cp "$DIR/$f" "firmware/$f"
          done
          cp effective.config firmware/effective.config

          cat > firmware/DEVICE.txt <<EOF
          vendor=$DEVICE_VENDOR
          model=$DEVICE_MODEL
          hardware=WMA301 V2
          profile=$DEVICE_PROFILE
          dts=$DEVICE_DTS
          target=mediatek/filogic
          source_repo=$SOURCE_REPO
          source_ref=$SOURCE_REF
          source_commit=$SOURCE_COMMIT
          EOF

          (cd firmware && sha256sum $(find . -maxdepth 1 -type f \( -name '*.bin' -o -name '*.itb' -o -name '*.ubi' \) -printf '%f\n' | sort) > SHA256SUMS-WMA301.txt)
          echo '--- artifact contents ---'
          ls -lah firmware

      - name: Final WMA301 artifact gate
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq 'vendor=TP-Link' firmware/DEVICE.txt
          grep -Fxq 'model=WMA301' firmware/DEVICE.txt
          grep -Fxq 'hardware=WMA301 V2' firmware/DEVICE.txt
          grep -Fxq 'profile=tplink_wma301' firmware/DEVICE.txt
          grep -Fxq 'dts=mt7981b-tplink-wma301' firmware/DEVICE.txt
          grep -Fxq 'target=mediatek/filogic' firmware/DEVICE.txt
          ! find firmware -maxdepth 1 -type f -iname '*asr3000*' | grep -q .
          (cd firmware && sha256sum -c SHA256SUMS-WMA301.txt)
          echo 'Final artifact gate PASSED: exact TP-Link WMA301 V2 only.'

      - name: Upload verified WMA301 artifact
        uses: actions/upload-artifact@v4
        with:
          name: TP-Link-WMA301-V2-${{ github.run_number }}
          path: firmware/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
