name: Build TP-Link WMA301 V2 ImmortalWrt (Verified R3)

on:
  workflow_dispatch:
    inputs:
      device_profile:
        description: 'Exact WMA301 layout/profile to build'
        required: true
        default: 'tplink_wma301'
        type: choice
        options:
          - tplink_wma301
          - tplink_wma301-stock
          - tplink_wma301-ubootmod
      include_initramfs:
        description: 'Also build initramfs/recovery image when the selected profile supports it'
        required: true
        default: true
        type: boolean
      publish_release:
        description: 'Publish a GitHub Release after every verification gate passes'
        required: true
        default: false
        type: boolean

concurrency:
  group: wma301-${{ github.ref }}-${{ inputs.device_profile }}
  cancel-in-progress: false

env:
  SOURCE_REPO: https://github.com/zeromake/immortalwrt-mt798x-6.6.git
  SOURCE_REF: openwrt-24.10-6.6
  DEVICE_PROFILE: ${{ inputs.device_profile }}
  INCLUDE_INITRAMFS: ${{ inputs.include_initramfs }}
  TZ: Asia/Shanghai

jobs:
  build:
    name: Build and verify WMA301
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
      source_commit: ${{ steps.meta.outputs.source_commit }}

    steps:
      - name: Checkout build project
        uses: actions/checkout@v4

      - name: Project self-check
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/self-check.py
          bash -n scripts/validate-config.sh
          bash -n scripts/build-local.sh
          python3 -m py_compile \
            scripts/self-check.py \
            scripts/prepare-config.py \
            scripts/verify-source.py \
            scripts/collect-firmware.py

      - name: Validate requested profile
        shell: bash
        run: |
          set -euo pipefail
          case "$DEVICE_PROFILE" in
            tplink_wma301|tplink_wma301-stock|tplink_wma301-ubootmod) ;;
            *) echo "Unsupported profile: $DEVICE_PROFILE" >&2; exit 2 ;;
          esac
          echo "Building exact profile: $DEVICE_PROFILE"
          echo "Initramfs requested: $INCLUDE_INITRAMFS"

      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk \
            gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool \
            lib32gcc-s1 libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev \
            libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev \
            libssl-dev libtool libyaml-dev llvm lld lrzsz msmtp nano ninja-build p7zip \
            p7zip-full patch pkgconf python3 python3-docutils python3-pip python3-ply \
            python3-pyelftools python3-setuptools qemu-utils re2c rsync scons squashfs-tools \
            subversion swig texinfo uglifyjs unzip upx-ucl vim wget xmlto xxd zlib1g-dev zstd

      - name: Clone controlled source branch
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --single-branch --branch "$SOURCE_REF" "$SOURCE_REPO" immortalwrt
          cd immortalwrt
          commit="$(git rev-parse HEAD)"
          echo "SOURCE_COMMIT=$commit" >> "$GITHUB_ENV"
          echo "Source repository: $SOURCE_REPO"
          echo "Source ref:        $SOURCE_REF"
          echo "Resolved commit:   $commit"

      - name: Hard gate - verify upstream WMA301 source contract
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-source.py \
            --profile "$DEVICE_PROFILE" \
            --source-dir immortalwrt
          test -f immortalwrt/defconfig/mt7981-ax3000.config

      - name: Update and install feeds
        shell: bash
        working-directory: immortalwrt
        run: |
          set -euo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate single-device config from canonical MT7981 defconfig
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --profile "$DEVICE_PROFILE"
            --source-dir immortalwrt
            --output immortalwrt/.config
            --extra-config configs/extra.config
          )
          if [[ "$INCLUDE_INITRAMFS" == "true" ]]; then
            args+=(--include-initramfs)
          fi
          python3 scripts/prepare-config.py "${args[@]}"

      - name: Resolve config with make defconfig
        shell: bash
        working-directory: immortalwrt
        run: |
          set -euo pipefail
          make defconfig

      - name: Hard gate - verify resolved target
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/validate-config.sh "$DEVICE_PROFILE" immortalwrt
          echo '--- resolved target ---'
          grep -E '^CONFIG_TARGET_mediatek=y$|^CONFIG_TARGET_mediatek_mt7981=y$|^CONFIG_TARGET_MULTI_PROFILE=y$|^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_.+=y$' immortalwrt/.config
          cp immortalwrt/.config "effective-${DEVICE_PROFILE}.config"

      - name: Download sources
        shell: bash
        working-directory: immortalwrt
        run: |
          set -euo pipefail
          make download -j"$(nproc)"
          tiny="$(find dl -type f -size -1024c -print || true)"
          if [[ -n "$tiny" ]]; then
            echo 'Removing suspiciously small downloads so the build cannot consume truncated files:'
            printf '%s\n' "$tiny"
            find dl -type f -size -1024c -delete
          fi

      - name: Compile firmware
        shell: bash
        working-directory: immortalwrt
        run: |
          set -euo pipefail
          echo "Compiling $DEVICE_PROFILE with $(nproc) threads"
          if ! make -j"$(nproc)"; then
            echo 'Parallel build failed; retrying once serially with verbose output.' >&2
            make -j1 V=s
          fi

      - name: Hard gate - recheck target and source contract after build
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/validate-config.sh "$DEVICE_PROFILE" immortalwrt
          python3 scripts/verify-source.py \
            --profile "$DEVICE_PROFILE" \
            --source-dir immortalwrt

      - name: Collect only verified WMA301 outputs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf firmware
          mkdir -p firmware
          python3 scripts/collect-firmware.py \
            --profile "$DEVICE_PROFILE" \
            --source-dir immortalwrt \
            --output-dir firmware
          cp "effective-${DEVICE_PROFILE}.config" firmware/effective.config
          {
            echo "source_repo=$SOURCE_REPO"
            echo "source_ref=$SOURCE_REF"
            echo "source_commit=$SOURCE_COMMIT"
            echo "device_profile=$DEVICE_PROFILE"
            echo "target=mediatek/filogic"
            echo "mt7981_meta_target=true"
            echo "initramfs=$INCLUDE_INITRAMFS"
            echo "workflow_run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > firmware/SOURCE.txt
          echo '--- verified publication set ---'
          ls -lah firmware

      - name: Final publication gate
        shell: bash
        working-directory: firmware
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS-WMA301.txt
          if find . -maxdepth 1 -type f -iname '*asr3000*' | grep -q .; then
            echo 'Wrong-device ASR3000 file detected in firmware directory.' >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('WMA301-BUILD-MANIFEST.json').read_text())
          assert m['device'] == 'TP-Link WMA301 V2'
          assert m['target'] == 'mediatek/filogic'
          assert m['profile'] in {'tplink_wma301', 'tplink_wma301-stock', 'tplink_wma301-ubootmod'}
          assert m['images']
          print('Manifest validation passed.')
          PY

      - name: Prepare artifact metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          artifact_name="WMA301-V2-${DEVICE_PROFILE}-${GITHUB_RUN_NUMBER}"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "source_commit=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Upload verified firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: firmware/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Publish verified release
    if: ${{ inputs.publish_release }}
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read

    steps:
      - name: Download verified build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: firmware

      - name: Re-verify downloaded artifact
        shell: bash
        working-directory: firmware
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS-WMA301.txt
          test -s SOURCE.txt
          test -s WMA301-BUILD-MANIFEST.json
          if find . -maxdepth 1 -type f -iname '*asr3000*' | grep -q .; then
            echo 'Wrong-device file detected after artifact download.' >&2
            exit 1
          fi

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
        run: |
          set -euo pipefail
          short_commit="${SOURCE_COMMIT:0:12}"
          tag="wma301-${DEVICE_PROFILE}-${GITHUB_RUN_NUMBER}-${short_commit}"
          cat > release-notes.md <<NOTES
          TP-Link WMA301 V2 verified ImmortalWrt build

          - Source: ${SOURCE_REPO}
          - Source ref: ${SOURCE_REF}
          - Source commit: ${SOURCE_COMMIT}
          - Target output: mediatek/filogic
          - MT7981 source meta-target: enabled
          - Device profile: ${DEVICE_PROFILE}
          - Initramfs requested: ${INCLUDE_INITRAMFS}
          - Validation: canonical-defconfig derivation, source-contract gate, exact single-device gate, wrong-device rejection, upstream SHA-256 verification, publication SHA-256 verification

          IMPORTANT: WMA301 profiles represent different flash layouts and are not interchangeable. Building a profile does not prove that it matches the router currently in your hands. Do not flash bootloader artifacts unless the device's current partition/U-Boot layout has been independently confirmed.
          NOTES
          gh release create "$tag" firmware/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "WMA301 V2 - ${DEVICE_PROFILE} - run ${GITHUB_RUN_NUMBER}" \
            --notes-file release-notes.md
