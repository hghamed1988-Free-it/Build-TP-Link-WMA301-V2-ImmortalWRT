name: Build TP-Link WMA301 - Source-Driven Verified R8

on:
  workflow_dispatch:
    inputs:
      device_profile:
        description: 'Exact WMA301 profile. Choose 2.1 only when the device label explicitly says WMA301 2.1.'
        required: true
        default: tplink_wma301
        type: choice
        options:
          - tplink_wma301
          - tplink_wma301-stock
          - tplink_wma301_2.1
      include_initramfs:
        description: 'Also build the exact-profile initramfs/recovery kernel'
        required: true
        default: true
        type: boolean

concurrency:
  group: wma301-r8-${{ github.ref }}-${{ inputs.device_profile }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SOURCE_REPO: https://github.com/padavanonly/immortalwrt-mt798x-6.6.git
  SOURCE_REF: openwrt-24.10-6.6
  DEVICE_PROFILE: ${{ inputs.device_profile }}
  TARGET_OUTPUT: bin/targets/mediatek/filogic
  TZ: UTC

jobs:
  build:
    name: Build and source-driven verify ${{ inputs.device_profile }}
    runs-on: ubuntu-22.04
    timeout-minutes: 420

    steps:
      - name: Checkout R8 build project
        uses: actions/checkout@v4

      - name: Validate requested exact profile
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/device_profiles.py --profile "$DEVICE_PROFILE"

      - name: R8 project self-tests
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/self_check.py
          python3 tests/run_tests.py

      - name: Show runner resources
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          nproc
          free -h
          df -h

      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          sudo apt-get clean
          df -h

      - name: Install upstream-documented build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext \
            gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 \
            libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev \
            lld llvm lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 \
            python3-pip python3-ply python3-docutils python3-pyelftools qemu-utils re2c rsync scons \
            squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd

      - name: Clone controlled ImmortalWrt source branch
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --single-branch --branch "$SOURCE_REF" "$SOURCE_REPO" immortalwrt
          SOURCE_COMMIT="$(git -C immortalwrt rev-parse HEAD)"
          echo "SOURCE_COMMIT=$SOURCE_COMMIT" >> "$GITHUB_ENV"
          echo "Source repo  : $SOURCE_REPO"
          echo "Source ref   : $SOURCE_REF"
          echo "Source commit: $SOURCE_COMMIT"

      - name: Hard gate 1 - verify current upstream WMA301 profile inventory and exact source contract
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_source.py --source-dir immortalwrt --profile "$DEVICE_PROFILE"
          {
            echo '## R8 exact source identity'
            echo '```text'
            python3 scripts/device_profiles.py --profile "$DEVICE_PROFILE"
            echo "source_commit=$SOURCE_COMMIT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update and install feeds with retries
        shell: bash
        working-directory: immortalwrt
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "feeds update attempt $attempt/3"
            if ./scripts/feeds update -a; then break; fi
            [[ "$attempt" == 3 ]] && { echo 'ERROR: feeds update failed after 3 attempts.' >&2; exit 20; }
            sleep $((attempt * 15))
          done
          for attempt in 1 2 3; do
            echo "feeds install attempt $attempt/3"
            if ./scripts/feeds install -a; then break; fi
            [[ "$attempt" == 3 ]] && { echo 'ERROR: feeds install failed after 3 attempts.' >&2; exit 21; }
            sleep $((attempt * 10))
          done

      - name: Restore source download cache
        uses: actions/cache@v4
        with:
          path: immortalwrt/dl
          key: wma301-r8-dl-${{ runner.os }}-${{ env.SOURCE_REF }}-${{ hashFiles('immortalwrt/feeds.conf.default') }}
          restore-keys: |
            wma301-r8-dl-${{ runner.os }}-${{ env.SOURCE_REF }}-

      - name: Generate exact single-device config from canonical MT7981 meta-defconfig
        shell: bash
        run: |
          set -euo pipefail
          args=(--source-dir immortalwrt --output immortalwrt/.config --profile "$DEVICE_PROFILE")
          if [[ "${{ inputs.include_initramfs }}" == "true" ]]; then
            args+=(--include-initramfs)
          fi
          python3 scripts/prepare_config.py "${args[@]}"

      - name: Resolve target with make defconfig
        shell: bash
        working-directory: immortalwrt
        run: |
          set -euo pipefail
          make defconfig

      - name: Hard gate 2 - resolved target must be mediatek/filogic and exactly the requested profile
        shell: bash
        run: |
          set -euo pipefail
          args=(--source-dir immortalwrt --profile "$DEVICE_PROFILE")
          if [[ "${{ inputs.include_initramfs }}" == "true" ]]; then
            args+=(--require-initramfs)
          fi
          python3 scripts/validate_config.py "${args[@]}"
          cp immortalwrt/.config effective.config
          echo '--- resolved exact identity ---'
          grep -E '^CONFIG_TARGET_mediatek=y$|^CONFIG_TARGET_mediatek_filogic=y$|^CONFIG_TARGET_DEVICE_.+_DEVICE_.+=y$|^CONFIG_TARGET_ROOTFS_INITRAMFS=y$' effective.config

      - name: Download sources with integrity retries
        shell: bash
        working-directory: immortalwrt
        run: |
          set -euo pipefail
          success=0
          for attempt in 1 2 3; do
            echo "make download attempt $attempt/3"
            if make download -j8; then
              tiny="$(find dl -type f -size -1024c -print 2>/dev/null || true)"
              if [[ -z "$tiny" ]]; then
                success=1
                break
              fi
              echo 'Removing suspiciously small downloads before retry:' >&2
              printf '%s\n' "$tiny" >&2
              find dl -type f -size -1024c -delete 2>/dev/null || true
            fi
            sleep $((attempt * 20))
          done
          [[ "$success" == 1 ]] || { echo 'ERROR: source download failed integrity gate after 3 attempts.' >&2; exit 30; }

      - name: Compile exact selected WMA301 profile
        shell: bash
        working-directory: immortalwrt
        run: |
          set -euo pipefail
          echo "Compiling $DEVICE_PROFILE with $(nproc) threads"
          if ! make -j"$(nproc)"; then
            echo 'Parallel build failed; retrying once serially with verbose output.' >&2
            make -j1 V=s
          fi

      - name: Hard gate 3 - revalidate source and exact resolved profile after build
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_source.py --source-dir immortalwrt --profile "$DEVICE_PROFILE"
          args=(--source-dir immortalwrt --profile "$DEVICE_PROFILE")
          if [[ "${{ inputs.include_initramfs }}" == "true" ]]; then
            args+=(--require-initramfs)
          fi
          python3 scripts/validate_config.py "${args[@]}"

      - name: Hard gate 4 - collect only exact upstream-checksummed selected-profile images
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --source-dir immortalwrt
            --output-dir firmware
            --profile "$DEVICE_PROFILE"
            --source-repo "$SOURCE_REPO"
            --source-ref "$SOURCE_REF"
            --source-commit "$SOURCE_COMMIT"
          )
          if [[ "${{ inputs.include_initramfs }}" == "true" ]]; then
            args+=(--require-initramfs)
          fi
          python3 scripts/collect_artifact.py "${args[@]}"
          cp effective.config firmware/effective.config
          echo "workflow_run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> firmware/BUILD-IDENTITY.txt
          ls -lah firmware

      - name: Hard gate 5 - final manifest identity and SHA-256 validation
        shell: bash
        run: |
          set -euo pipefail
          args=(--artifact-dir firmware --profile "$DEVICE_PROFILE")
          if [[ "${{ inputs.include_initramfs }}" == "true" ]]; then
            args+=(--require-initramfs)
          fi
          python3 scripts/final_gate.py "${args[@]}"
          {
            echo '## R8 verification result'
            echo '**PASSED: source-driven exact profile + target + SHA-256 gates**'
            echo '```text'
            cat firmware/BUILD-IDENTITY.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified exact WMA301 artifact only
        uses: actions/upload-artifact@v4
        with:
          name: TP-Link-WMA301-R8-${{ inputs.device_profile }}-${{ github.run_number }}
          path: firmware/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
